<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 224" role="img" aria-label="SimpleConvNet从输入到分类分数的结构与尺寸" font-family="Microsoft YaHei, sans-serif"><rect width="830" height="224" rx="10" fill="#f0f5ef"/><text x="28" y="32" font-size="12" fill="#17675f" >SIMPLE CONVNET  /  单个样本的形状</text><rect x="26" y="62" width="142" height="106" rx="6" fill="white" stroke="#cbd9cd"/><text x="38" y="88" font-size="13" fill="#233238" >输入</text><text x="38" y="120" font-size="16" fill="#17675f" >1 × 28 × 28</text><text x="38" y="149" font-size="10" fill="#647277" >灰度图像</text><text x="172" y="122" font-size="14" fill="#17675f" >→</text><rect x="184" y="62" width="142" height="106" rx="6" fill="white" stroke="#cbd9cd"/><text x="196" y="88" font-size="13" fill="#233238" >Conv + ReLU</text><text x="196" y="120" font-size="16" fill="#17675f" >30 × 24 × 24</text><text x="196" y="149" font-size="10" fill="#647277" >30个5×5卷积核</text><text x="330" y="122" font-size="14" fill="#17675f" >→</text><rect x="342" y="62" width="142" height="106" rx="6" fill="white" stroke="#cbd9cd"/><text x="354" y="88" font-size="13" fill="#233238" >Max Pool</text><text x="354" y="120" font-size="16" fill="#17675f" >30 × 12 × 12</text><text x="354" y="149" font-size="10" fill="#647277" >2×2 / stride 2</text><text x="488" y="122" font-size="14" fill="#17675f" >→</text><rect x="500" y="62" width="142" height="106" rx="6" fill="white" stroke="#cbd9cd"/><text x="512" y="88" font-size="13" fill="#233238" >Affine + ReLU</text><text x="512" y="120" font-size="16" fill="#17675f" >100</text><text x="512" y="149" font-size="10" fill="#647277" >展平4320个特征</text><text x="646" y="122" font-size="14" fill="#17675f" >→</text><rect x="658" y="62" width="142" height="106" rx="6" fill="white" stroke="#cbd9cd"/><text x="670" y="88" font-size="13" fill="#233238" >Affine</text><text x="670" y="120" font-size="16" fill="#17675f" >10</text><text x="670" y="149" font-size="10" fill="#647277" >分类分数</text><text x="28" y="200" font-size="12" fill="#647277" >特征提取：卷积 → 非线性 → 池化</text><text x="503" y="200" font-size="12" fill="#647277" >分类头：组合特征 → 分类分数</text></svg>