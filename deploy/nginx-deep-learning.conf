# Include inside the existing glance02.xyz HTTPS server block.
# Its document root remains /var/www/myhtml.
location = /deep-learning {
    return 302 /deep-learning/reference/index.html;
}

location = /deep-learning/ {
    return 302 /deep-learning/reference/index.html;
}

location ^~ /deep-learning/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
